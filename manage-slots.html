<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Slots | HealthEase</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }

    body {
      background-color: #f7fafc;
      margin: 0;
      color: #2d3748;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #2b6cb0;
      font-weight: 600;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-label {
      font-weight: 500;
      color: #2d3748;
    }

    .btn-primary {
      background-color: #2b6cb0;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn-primary:hover {
      background-color: #1e4e8c;
    }

    .btn-danger {
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
    }

    .slot-list {
      margin-top: 30px;
    }

    .slot-item {
      background-color: #edf2f7;
      padding: 12px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      background-color: #2b6cb0;
      color: white;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
    }

    .back-btn:hover {
      background-color: #1e4e8c;
    }

    @media (max-width: 768px) {
      .container {
        margin: 20px;
        padding: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="/site/DOCTOR/doctor_dashboard.html" class="back-btn">← Back to Dashboard</a>
    <h2>Manage Time Slots</h2>

    <form id="slotForm">
      <div class="mb-3">
        <label class="form-label">Select Date</label>
        <input type="date" id="slotDate" class="form-control" required>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Start Time</label>
          <input type="time" id="startTime" class="form-control" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">End Time</label>
          <input type="time" id="endTime" class="form-control" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Available Slots</label>
        <input type="number" id="slotsCount" class="form-control" placeholder="Enter number of slots (e.g. 10)" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Add Slot</button>
    </form>

    <div class="slot-list mt-4">
      <h5 class="text-center mb-3 text-primary">Your Slots</h5>
      <div id="slotsContainer"></div>
    </div>
  </div>

  <script>
    const slotForm = document.getElementById('slotForm');
    const slotsContainer = document.getElementById('slotsContainer');

    // Load saved slots from localStorage
    let slots = JSON.parse(localStorage.getItem('doctorSlots')) || [];

    function renderSlots() {
      slotsContainer.innerHTML = '';
      if (slots.length === 0) {
        slotsContainer.innerHTML = '<p class="text-center text-muted">No slots added yet.</p>';
        return;
      }

      slots.forEach((slot, index) => {
        const div = document.createElement('div');
        div.classList.add('slot-item');
        div.innerHTML = `
          <span><strong>${slot.date}</strong> — ${slot.start} to ${slot.end} (${slot.count} slots)</span>
          <button class="btn btn-danger btn-sm" onclick="deleteSlot(${index})">Delete</button>
        `;
        slotsContainer.appendChild(div);
      });
    }

    slotForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const date = document.getElementById('slotDate').value;
      const start = document.getElementById('startTime').value;
      const end = document.getElementById('endTime').value;
      const count = document.getElementById('slotsCount').value;

      slots.push({ date, start, end, count });
      localStorage.setItem('doctorSlots', JSON.stringify(slots));
      renderSlots();
      slotForm.reset();
    });

    function deleteSlot(index) {
      slots.splice(index, 1);
      localStorage.setItem('doctorSlots', JSON.stringify(slots));
      renderSlots();
    }

    renderSlots();
  </script>

</body>
</html>
