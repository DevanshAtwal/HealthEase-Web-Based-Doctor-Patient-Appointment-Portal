<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Registration - HealthEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="logo">HealthEase</div>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="patient_register.html">Patient Register</a></li>
      <li><a href="doctor_register.html" class="active">Doctor Register</a></li>
      <li><a href="login.html">Login</a></li>
    </ul>
  </nav>

  <div class="form-container">
    <h2>Doctor Registration</h2>
    <form>
      <input type="text" placeholder="Full Name" required>
      <input type="tel" placeholder="Contact Number" required>
      <input type="text" placeholder="Specialization" required>
      <input type="text" placeholder="Education" required>
      <input type="text" placeholder="Hospital/Clinic Name" required>
      <input type="text" placeholder="Location" required>
      <input type="number" placeholder="Consultation Fee" required>
      <input type="text" placeholder="Available Time Slots" required>
      <input type="file" required>
      <input type="text" placeholder="Username" required>
      <input type="password" placeholder="Password" required>
      <input type="password" placeholder="Confirm Password" required>
      <button type="submit">Register</button>
    </form>
  </div>
</body>
</html>
