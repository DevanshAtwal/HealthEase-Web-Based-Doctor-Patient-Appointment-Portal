<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Settings | HealthEase</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }

    body {
      background-color: #f7fafc;
      color: #2d3748;
      margin: 0;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #2b6cb0;
      font-weight: 600;
      text-align: center;
      margin-bottom: 30px;
    }

    .form-label { font-weight: 500; color: #2d3748; }

    .btn-save {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn-save:hover {
      background-color: #1e4e8c;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      background-color: #2b6cb0;
      color: white;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
    }

    .back-btn:hover {
      background-color: #1e4e8c;
    }

    @media (max-width: 768px) {
      .container { margin: 20px; padding: 20px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="/site/PATIENT/patient_dashboard.html" class="back-btn">← Back to Dashboard</a>
    <h2>Profile Settings</h2>

    <form id="profileForm">
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Mobile Number</label>
          <input type="tel" class="form-control" id="mobile" placeholder="Enter your mobile number" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Gender</label>
          <select class="form-select" id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Age</label>
          <input type="number" class="form-control" id="age" placeholder="Enter your age" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Address</label>
          <input type="text" class="form-control" id="address" placeholder="Enter your address" required>
        </div>
      </div>

      <div class="row mb-4">
        <div class="col-md-6">
          <label class="form-label">New Password</label>
          <input type="password" class="form-control" id="password" placeholder="Enter new password">
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm Password</label>
          <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password">
        </div>
      </div>

      <div class="text-center">
        <button type="submit" class="btn-save">Save Changes</button>
      </div>
    </form>
  </div>

  <script>
    // Dummy data (can be replaced with actual backend fetch later)
    const patientProfile = {
      name: "Janhavi Kale",
      email: "janhavi@example.com",
      mobile: "9876543210",
      gender: "Female",
      age: 24,
      address: "Pune, Maharashtra"
    };

    // Load profile data into form
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('name').value = patientProfile.name;
      document.getElementById('email').value = patientProfile.email;
      document.getElementById('mobile').value = patientProfile.mobile;
      document.getElementById('gender').value = patientProfile.gender;
      document.getElementById('age').value = patientProfile.age;
      document.getElementById('address').value = patientProfile.address;
    });

    // Save form data
    document.getElementById('profileForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = document.getElementById('name').value;
      alert(`Profile updated successfully for ${name}!`);
    });
  </script>

</body>
</html>
