<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Patient Info - HealthEase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="logo">HealthEase</div>
    <ul>
      <li><a href="patient_dashboard.html">Dashboard</a></li>
      <li><a href="login.html">Logout</a></li>
    </ul>
  </nav>

  <form method="POST">
  <input type="text" name="fullname" value="{{ patient.fullname }}" placeholder="Full Name" required>
  <input type="tel" name="mobile" value="{{ patient.mobile }}" placeholder="Mobile Number" required>
  <input type="text" name="address" value="{{ patient.address }}" placeholder="Address" required>
  <input type="text" name="username" value="{{ patient.username }}" placeholder="Username" required>
  <input type="password" name="password" placeholder="New Password (optional)">
  <button type="submit" class="btn">Update Information</button>
</form>

</body>
</html>
