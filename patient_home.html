<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthEase - Patient Dashboard</title>
  <link rel="stylesheet" href="patient_home.css">
</head>
<body>
  <header>
    <h1>Welcome to HealthEase</h1>
    <p>"Observation, Reason, Human Understanding, Courage; these make the physician."</p>
    <p>- Martin H. Fischer</p>
    <a href="appointment.html" class="btn">Book an Appointment</a>
  </header>

  <section class="steps">
    <div class="step">
      <img src="images/find-doctor.png" alt="Find Doctor">
      <p>Find a Doctor</p>
    </div>
    <div class="arrow">➤</div>

    <div class="step">
      <img src="images/doctor-profile.png" alt="Doctor Profile">
      <p>Check Doctor Profile</p>
    </div>
    <div class="arrow">➤</div>

    <div class="step">
      <img src="images/book-appointment.png" alt="Book Appointment">
      <p>Book an Appointment</p>
    </div>
    <div class="arrow">➤</div>

    <div class="step">
      <img src="images/medical-help.png" alt="Get Help">
      <p>Get Medical Help</p>
    </div>
  </section>
</body>
</html>
