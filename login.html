<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | HealthEase</title>

  <!-- Bootstrap + Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Poppins', sans-serif;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #2b6cb0, #63b3ed);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .login-box {
      background: #fff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }

    h2 {
      color: #2b6cb0;
      font-weight: 600;
      margin-bottom: 20px;
    }

    select, input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #2b6cb0;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 16px;
      font-weight: 500;
      transition: 0.3s;
    }

    button:hover {
      background-color: #1e4e8c;
    }

    .register-link {
      margin-top: 15px;
      font-size: 14px;
    }

    .register-link a {
      color: #2b6cb0;
      text-decoration: none;
      font-weight: 500;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>HealthEase Login</h2>

    <select id="role">
      <option value="">Select Role</option>
      <option value="patient">Patient</option>
      <option value="doctor">Doctor</option>
      <option value="admin">Admin</option>
    </select>

    <input type="text" id="mobile" placeholder="Mobile Number (for patient/doctor)" style="display:none">
    <input type="email" id="email" placeholder="Email (for admin)" style="display:none">
    <input type="password" id="password" placeholder="Password" required>

    <button onclick="loginUser()">Login</button>

    <div class="register-link">
      Don't have an account? <a href="/site/register.html">Register Here</a>
    </div>
  </div>

  <script>
    // show/hide inputs based on selected role
    document.getElementById('role').addEventListener('change', function(){
      const r = this.value;
      document.getElementById('mobile').style.display = (r === 'patient' || r === 'doctor') ? 'block' : 'none';
      document.getElementById('email').style.display = (r === 'admin') ? 'block' : 'none';
    });

    async function loginUser() {
      const role = document.getElementById('role').value.trim();
      const mobile = document.getElementById('mobile').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!role || !password) {
        alert('Please select role and enter password');
        return;
      }

      const payload = { role, password };
      if (role === 'admin') payload.email = email;
      else payload.mobile = mobile;

      try {
        const res = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
          alert(data.error || 'Login failed');
          return;
        }

        // store non-sensitive info for UI (avoid storing passwords)
        localStorage.setItem('user_name', data.name || '');
        localStorage.setItem('role', data.role || '');

        // Redirect based on role
        if (data.role === 'admin') window.location.href = '/site/ADMIN/admin_dashboard.html';
        else if (data.role === 'doctor') window.location.href = '/site/DOCTOR/doctor_dashboard.html';
        else window.location.href = '/site/PATIENT/patient_dashboard.html';
      } catch (err) {
        console.error(err);
        alert('Login request failed');
      }
    }
  </script>

</body>
</html>
