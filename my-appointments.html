<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments | HealthEase</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }

    body {
      background-color: #f7fafc;
      margin: 0;
      color: #2d3748;
    }

    .container {
      max-width: 1000px;
      margin: 50px auto;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #2b6cb0;
      font-weight: 600;
      text-align: center;
      margin-bottom: 30px;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      background-color: #2b6cb0;
      color: white;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
    }

    .back-btn:hover {
      background-color: #1e4e8c;
    }

    .table th {
      background-color: #2b6cb0;
      color: white;
      text-align: center;
    }

    .table td {
      text-align: center;
      vertical-align: middle;
    }

    .btn-cancel {
      background-color: #e53e3e;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      transition: 0.3s;
    }

    .btn-cancel:hover {
      background-color: #c53030;
    }

    .status-badge {
      padding: 6px 10px;
      border-radius: 6px;
      color: white;
      font-weight: 500;
    }

    .status-upcoming { background-color: #3182ce; }
    .status-completed { background-color: #38a169; }
    .status-cancelled { background-color: #e53e3e; }

    @media (max-width: 768px) {
      .container { margin: 20px; padding: 20px; }
      .table th, .table td { font-size: 14px; }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="/site/PATIENT/patient_dashboard.html" class="back-btn">← Back to Dashboard</a>
    <h2>My Appointments</h2>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th>Appointment ID</th>
            <th>Doctor Name</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="appointmentList">
          <!-- Example rows -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const appointmentList = document.getElementById('appointmentList');

    async function loadAppointments() {
      const patientName = localStorage.getItem('patient_name');
      if (!patientName) {
        appointmentList.innerHTML = '<tr><td colspan="6">No patient information found. Please book an appointment or set patient_name in localStorage.</td></tr>';
        return;
      }

      try {
        const res = await fetch(`/patient/appointments?patient_name=${encodeURIComponent(patientName)}`);
        const data = await res.json();
        const appts = data.appointments || [];

        if (appts.length === 0) {
          appointmentList.innerHTML = '<tr><td colspan="6">No appointments found.</td></tr>';
          return;
        }

        appointmentList.innerHTML = '';
        appts.forEach((apt, index) => {
          const tr = document.createElement('tr');
          let statusClass = '';
          if (apt.status === 'upcoming') statusClass = 'status-upcoming';
          else if (apt.status === 'completed') statusClass = 'status-completed';
          else statusClass = 'status-cancelled';

          // Use created_at as date/time placeholder
          const date = new Date(apt.created_at).toLocaleDateString();
          const time = new Date(apt.created_at).toLocaleTimeString();

          tr.innerHTML = `
            <td>${apt.id}</td>
            <td>${apt.doctor_name || ''}</td>
            <td>${date}</td>
            <td>${time}</td>
            <td><span class="status-badge ${statusClass}">${apt.status.charAt(0).toUpperCase() + apt.status.slice(1)}</span></td>
            <td>${apt.status === 'upcoming' ? `<button class="btn-cancel" onclick="cancelAppointment(${apt.id})">Cancel</button>` : `<button class="btn-cancel" disabled>Cancel</button>`}</td>
          `;
          appointmentList.appendChild(tr);
        });
      } catch (err) {
        appointmentList.innerHTML = `<tr><td colspan="6">Error loading appointments: ${err.message}</td></tr>`;
      }
    }

    async function cancelAppointment(appointmentId) {
      if (!confirm('Are you sure you want to cancel this appointment?')) return;
      try {
        const res = await fetch(`/patient/appointments/${appointmentId}/cancel`, { method: 'POST' });
        if (res.ok) {
          await loadAppointments();
        } else {
          alert('Failed to cancel appointment');
        }
      } catch (err) {
        alert('Network error: ' + err.message);
      }
    }

    // Load on page open
    loadAppointments();
  </script>

</body>
</html>
