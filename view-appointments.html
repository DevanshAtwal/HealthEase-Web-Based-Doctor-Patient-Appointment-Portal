<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Appointments | HealthEase</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { font-family: 'Poppins', sans-serif; scroll-behavior: smooth; }

    body {
      background-color: #f7fafc;
      margin: 0;
      color: #2d3748;
    }

    .container {
      max-width: 1100px;
      margin: 50px auto;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      color: #2b6cb0;
      font-weight: 600;
      text-align: center;
      margin-bottom: 30px;
    }

    .table th {
      background-color: #2b6cb0;
      color: white;
      text-align: center;
    }

    .table td {
      text-align: center;
      vertical-align: middle;
    }

    .btn-view {
      background-color: #2b6cb0;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn-view:hover {
      background-color: #1e4e8c;
    }

    .btn-cancel {
      background-color: #e53e3e;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .btn-cancel:hover {
      background-color: #c53030;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 20px;
      background-color: #2b6cb0;
      color: white;
      padding: 8px 18px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
    }

    .back-btn:hover {
      background-color: #1e4e8c;
    }

    @media (max-width: 768px) {
      .container {
        margin: 20px;
        padding: 20px;
      }
      .table th, .table td {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <a href="doctor_dashboard.html" class="back-btn">← Back to Dashboard</a>
    <h2>Your Appointments</h2>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th>Appointment ID</th>
            <th>Patient Name</th>
            <th>Date</th>
            <th>Time</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>APT-001</td>
            <td>Riya Sharma</td>
            <td>2025-11-12</td>
            <td>10:00 AM</td>
            <td><span class="badge bg-success">Confirmed</span></td>
            <td>
              <button class="btn-view">View</button>
              <button class="btn-cancel">Cancel</button>
            </td>
          </tr>
          <tr>
            <td>APT-002</td>
            <td>Aarav Mehta</td>
            <td>2025-11-13</td>
            <td>2:30 PM</td>
            <td><span class="badge bg-warning text-dark">Pending</span></td>
            <td>
              <button class="btn-view">View</button>
              <button class="btn-cancel">Cancel</button>
            </td>
          </tr>
          <tr>
            <td>APT-003</td>
            <td>Neha Patel</td>
            <td>2025-11-15</td>
            <td>5:00 PM</td>
            <td><span class="badge bg-danger">Cancelled</span></td>
            <td>
              <button class="btn-view">View</button>
              <button class="btn-cancel" disabled>Cancel</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
